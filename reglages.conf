# Les réglages de Hermes, appliqués par install.py avec `hermes config set <clé> <valeur>`.
# Une ligne par réglage : la clé, la valeur, puis un commentaire facultatif après #.
# install.py ne réécrit jamais data/config.yaml : il change ces valeurs une à une, à chaque passage.

# Il demande avant toute commande dangereuse (au lieu de laisser un modèle juger : « smart »).
approvals.mode                  manual

# Il ne retient rien et ne crée aucun skill de lui-même : seulement à ma demande.
# À 0, la relecture automatique en arrière-plan (background_review), qui écrit mémoire et skills, ne se déclenche plus.
memory.nudge_interval           0
skills.creation_nudge_interval  0
